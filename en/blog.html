<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal website - Notes and news">
  <title>Notes &amp; News | Cameron Silva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script defer src="../assets/js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">Cameron Silva</a>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">Menu</button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">Home</a>
        <a href="cv.html">CV</a>
        <a class="active" href="blog.html">Notes &amp; News</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="lang-switch lang-en" aria-label="Language switch">
        <span class="lang-switch-thumb" aria-hidden="true"></span>
        <a class="lang-option" href="../blog.html" lang="fr">FR</a>
        <a class="lang-option active" href="blog.html" lang="en">EN</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container page-intro">
      <h1>Notes &amp; News</h1>
      <p class="lead">Notes sorted from newest to oldest.</p>
    </div>

    <div class="container blog-tools">
      <p class="muted keyword-title">Filter by keyword</p>
      <div class="keyword-filters" role="group" aria-label="Filter notes by keyword">
        <button class="keyword-btn active" type="button" data-keyword="all">All</button>
        <button class="keyword-btn" type="button" data-keyword="international">International</button>
        <button class="keyword-btn" type="button" data-keyword="finance">Finance</button>
        <button class="keyword-btn" type="button" data-keyword="publicpolicy">Public policy</button>
      </div>
    </div>

    <div class="container blog-scroll-wrap">
      <div
        class="blog-list"
        id="blog-list"
        data-source="../assets/data/notes.en.json"
        data-assets="../assets/img/"
        data-read-label="Read note"
        data-empty-label="No notes published yet."
        data-error-label="Notes could not be loaded right now."
        data-tag-labels='{"international":"International","finance":"Finance","publicpolicy":"Public policy"}'
      >
        <p class="muted">Loading notes…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© 2026 - Cameron Silva</p>
      <p><a href="contact.html">Contact</a></p>
    </div>
  </footer>
</body>
</html>
